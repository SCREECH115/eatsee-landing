<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Pobierz EatSee</title>
<meta name="description" content="EatSee - licznik kalorii ze zdjęcia i planer posiłków z AI. Pobierz z App Store albo Google Play." />
<link rel="canonical" href="https://eatsee.pl/" />
<meta property="og:title" content="EatSee - skaner i planer posiłków. Licznik kalorii z AI" />
<meta property="og:image" content="https://eatsee.pl/og.png" />
<meta property="og:url" content="https://eatsee.pl/" />
<link rel="icon" type="image/png" href="/img/logo-128.png" />
<script>
  /* Link z reklam IG/TikTok: telefon od razu laduje w swoim sklepie, komputer na pelnym landingu */
  (function () {
    var appStore = 'https://apps.apple.com/pl/app/eatsee-kalorie-ze-zdj%C4%99cia/id6789152922?l=pl';
    var googlePlay = 'https://play.google.com/store/apps/details?id=com.eatsee.app';
    var ua = navigator.userAgent || '';
    /* iPadOS przedstawia sie jako Mac, zdradza go dopiero ekran dotykowy */
    var ios = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var android = !ios && /Android/i.test(ua);

    /* Parametry utm z linku reklamy ida do Google Play jako referrer, widac je potem w Play Console */
    var referrer = { utm_source: 'eatsee.pl', utm_medium: 'ad' };
    try {
      var params = new URLSearchParams(location.search);
      ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'].forEach(function (key) {
        if (params.get(key)) { referrer[key] = params.get(key); }
      });
    } catch (e) {}
    var pairs = Object.keys(referrer).map(function (key) { return key + '=' + encodeURIComponent(referrer[key]); });
    googlePlay += '&referrer=' + encodeURIComponent(pairs.join('&'));

    document.addEventListener('DOMContentLoaded', function () {
      var link = document.getElementById('googlePlayLink');
      if (link) { link.href = googlePlay; }
    });

    if (ios || android) {
      document.documentElement.setAttribute('data-platform', ios ? 'ios' : 'android');
      location.replace(ios ? appStore : googlePlay);
    } else {
      location.replace('/' + location.search);
    }
  })();
</script>
<style>
  :root{
    --bg:#F5F1E9;
    --surface:#FFFFFF;
    --accent:#A76843;
    --accent-dark:#714525;
    --text:#1B1A17;
    --text-2:#57534C;
    --badge:#1B1A17;
    --badge-border:transparent;
    --radius:20px;
    --shadow:0 6px 24px rgba(27,26,23,.07);
    --border:1px solid rgba(27,26,23,.09);
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#16120D;
    --surface:#211B14;
    --accent:#C9905F;
    --accent-dark:#E4BB94;
    --text:#F2ECE1;
    --text-2:#B9AF9F;
    --badge:#2B241B;
    --badge-border:rgba(255,255,255,.14);
    --shadow:0 6px 24px rgba(0,0,0,.45);
    --border:1px solid rgba(255,255,255,.08);
    color-scheme:dark;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
  }
  .card{
    width:100%;
    max-width:420px;
    background:var(--surface);
    border-radius:var(--radius);
    border:var(--border);
    box-shadow:var(--shadow);
    padding:40px 28px 32px;
    text-align:center;
  }
  .logo{
    display:inline-flex;align-items:center;gap:10px;margin-bottom:26px;
    font-size:26px;font-weight:800;color:var(--text);text-decoration:none;
  }
  .logo img{border-radius:10px}
  .logo .dot{color:var(--accent)}
  h1{font-size:21px;font-weight:700;margin-bottom:10px}
  p.lead{font-size:15px;line-height:22px;color:var(--text-2)}
  .store-badges{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:24px}
  .store-badge{
    display:inline-flex;align-items:center;justify-content:center;gap:11px;
    width:100%;max-width:260px;
    background:var(--badge);color:#fff;text-decoration:none;
    border:1px solid var(--badge-border);
    padding:12px 20px 12px 16px;border-radius:999px;
  }
  .store-badge svg{width:24px;height:24px;flex:none;fill:#fff}
  .store-badge .txt{display:flex;flex-direction:column;line-height:1.15;text-align:left}
  .store-badge .txt small{font-size:11px;font-weight:500;opacity:.85;letter-spacing:.02em}
  .store-badge .txt strong{font-size:16px;font-weight:700;letter-spacing:-.01em}
  .more{display:inline-block;margin-top:22px;font-size:14px;font-weight:600;color:var(--accent-dark)}
  /* Na telefonie zostaje tylko sklep tego systemu, bez JS albo na innym urzadzeniu oba */
  :root[data-platform="ios"] [data-show]:not([data-show~="ios"]),
  :root[data-platform="android"] [data-show]:not([data-show~="android"]),
  :root:not([data-platform]) [data-show]:not([data-show~="other"]){display:none}
</style>
<script>
  (function () {
    try {
      var stored = localStorage.getItem('eatsee-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = stored === 'dark' || stored === 'light' ? stored : prefersDark ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
</head>
<body>
<main class="card">
  <a class="logo" href="/"><img src="/img/logo-128.png" alt="" width="40" height="40"><span>EatSee<span class="dot">.</span></span></a>

  <h1>
    <span data-show="ios">Otwieramy App Store…</span>
    <span data-show="android">Otwieramy Google Play…</span>
    <span data-show="other">Pobierz EatSee</span>
  </h1>
  <p class="lead">
    <span data-show="ios android">Jeśli sklep nie otworzył się sam, stuknij przycisk poniżej.</span>
    <span data-show="other">Licznik kalorii ze zdjęcia i planer posiłków z AI. Na iPhone'a i Androida.</span>
  </p>

  <div class="store-badges">
    <a href="https://apps.apple.com/pl/app/eatsee-kalorie-ze-zdj%C4%99cia/id6789152922?l=pl" class="store-badge" data-show="ios other" aria-label="Pobierz EatSee w App Store">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.1 12.6c0-2.5 2-3.7 2.1-3.8-1.2-1.7-3-1.9-3.6-1.9-1.5-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.9-1.7 0-3.3 1-4.2 2.5-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.5 0 2 .8 3.3.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9-.1 0-2.8-1.1-2.8-4.2zM14.6 4.6c.7-.8 1.1-2 1-3.1-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.9-1.4z"/></svg>
      <span class="txt"><small>Pobierz w</small><strong>App Store</strong></span>
    </a>
    <a href="https://play.google.com/store/apps/details?id=com.eatsee.app" class="store-badge" id="googlePlayLink" data-show="android other" aria-label="Pobierz EatSee z Google Play">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.4 2.3c-.3.3-.4.7-.4 1.2v17c0 .5.1.9.4 1.2l.1.1 9.5-9.6v-.4L4.5 2.2l-.1.1zm12.8 6.4L14 11.8l3.2 3.2 3.7-2.1c1.1-.6 1.1-1.6 0-2.2l-3.7-2zM5.2 21.7c.4.2.9.2 1.5-.1l10-5.7-3-3-8.5 8.8zm0-19.4l8.5 8.7 3-3-10-5.6c-.6-.3-1.1-.4-1.5-.1z"/></svg>
      <span class="txt"><small>Pobierz z</small><strong>Google Play</strong></span>
    </a>
  </div>

  <a class="more" href="/">Dowiedz się więcej o EatSee</a>
</main>
</body>
</html>
